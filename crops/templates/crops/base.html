<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Farmer Crop Record System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f8f8f8; }
        .container { width: 800px; margin: 30px auto; background: #fff; padding: 20px; box-shadow: 0 0 6px rgba(0,0,0,0.1); }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 8px 14px; background: #007bff; color: #fff; text-decoration: none; border-radius: 4px; }
        .btn.secondary { background: #6c757d; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px 10px; border: 1px solid #ddd; text-align: left; }
        footer { text-align: center; margin-top: 20px; color: #666; }
        .message { padding: 10px; background: #ffeeba; margin-bottom: 10px; border-radius: 4px; }
        .toplinks { gap: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <div>
                <a class="btn" href="{% url 'home' %}">Home</a>
                <a class="btn" href="{% url 'crop_list' %}">Crops</a>
            </div>
            <div class="toplinks">
                {% if user.is_authenticated %}
                    <span>Welcome, {{ user.username }}</span>
                    <a class="btn secondary" href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a class="btn" href="{% url 'login' %}">Login</a>
                    <a class="btn secondary" href="{% url 'signup' %}">Signup</a>
                {% endif %}
            </div>
        </div>
        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
        <footer>
            Farmer Support Org © 2026
        </footer>
    </div>
</body>
</html>
