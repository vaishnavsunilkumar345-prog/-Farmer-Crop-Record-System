{% extends 'crops/base.html' %}
{% block title %}Edit crop - Crop Records{% endblock %}
{% block content %}
    <div class="page-head"><div><h1>Edit {{ crop.crop_name }}</h1><p>Changes apply as soon as you save.</p></div></div>
    <form class="form-card" method="post">
        {% csrf_token %}
        {% include 'crops/_form_fields.html' %}
        <div class="form-actions">
            <button class="btn" type="submit">Save changes</button>
            <a class="btn secondary" href="{% url 'crop_list' %}">Cancel</a>
        </div>
    </form>
{% endblock %}
