{% extends 'crops/base.html' %}
{% block title %}Add crop - Crop Records{% endblock %}
{% block content %}
    <div class="page-head"><div><h1>Add crop</h1><p>All four fields are required.</p></div></div>
    <form class="form-card" method="post">
        {% csrf_token %}
        {% include 'crops/_form_fields.html' %}
        <div class="form-actions">
            <button class="btn" type="submit">Save crop</button>
            <a class="btn secondary" href="{% url 'crop_list' %}">Cancel</a>
        </div>
    </form>
{% endblock %}
